# Pixi environment for the squidpy-dfs stack (squidpy + the PyPI-only extras).
#
# Standalone manifest, like envs/spaceranger/pixi.toml, because its PyPI
# dependencies make solving require the conda-to-PyPI mapping, which cannot be
# fetched on this network; that made the root workspace impossible to lock, so
# `pixi run` failed at the root for every task, including the snakemake one.
#
# The pipeline itself does not use this env: the Snakefile runs in
# envs/squidpy/pixi.toml. This one is for interactive use (ipykernel etc.):
#   pixi run --manifest-path envs/squidpy-dfs/pixi.toml python ...
#   pixi run --manifest-path envs/squidpy-dfs/pixi.toml jupyter lab
#
# It has never been installed or locked on this machine; the content is moved
# verbatim from the feature it used to be in the root pixi.toml.

[workspace]
authors = ["Kevin Stachelek <kstachel@uci.edu>"]
channels = ["conda-forge", "bioconda"]
name = "squidpy-dfs"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
squidpy = "*"
ipykernel = "*"
ca-certificates = "*"
certifi = "*"
openssl = "*"

[pypi-dependencies]
adjusttext = "==1.3.0"
et-xmlfile = "==2.0.0"
geodatasets = "==2026.1.0"
gseapy = "==1.1.12"
mizani = "==0.14.4"
openpyxl = "==3.1.5"
plotnine = "==0.15.3"
polars = "==1.38.1"
polars-runtime-32 = "==1.38.1"
scikit-misc = "==0.5.2"
statsmodels = "==0.14.6"
