[workspace]
authors = ["Kevin Stachelek <kstachel@uci.edu>"]
channels = ["conda-forge"]
name = "squidpy"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Forward to the pixi *global* install in $HOME, not a dependency of this workspace:
# an env on /dfs9 makes snakemake take minutes to import, the home install seconds
# (see README "Running"). Extra args pass straight through, e.g.
#   pixi run snakemake --profile slurm -n
snakemake = "$HOME/.pixi/bin/snakemake"

[dependencies]
