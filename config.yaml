# Multi-sample configuration file for CellRanger Snakemake workflow

# ENSEMBL_RELEASE=84
# ENSEMBL_GRCh38_BASE=ftp://ftp.ensembl.org/pub/release-${ENSEMBL_RELEASE}/fasta/homo_sapiens/dna

# List of samples to process  
# NOTE: Samples are now auto-detected from data/FASTQ directory
# The following list is used as fallback if auto-detection fails
samples:

metadata: "data/metadata.csv"

# Input/Output paths
paths: 
  fastqs: "data/FASTQ"
  output: "output"
  results: "results"


# Reference genome/transcriptome
references:
  # Human reference (default)
  transcriptome: "/dfs8/commondata/cellranger/refdata-cellranger-GRCh38-3.0.0"
  # Mouse reference (alternative)
  # transcriptome: "/dfs8/commondata/cellranger/refdata-cellranger-mm10-1.2.0"
  repeat_mask: "/dfs9/ucightf-lab/kstachel/kstachel_references/repeatmasker/Homo_sapiens_rm_refseq.out.gz"

# CellRanger parameters
params:
  localcores: 8
  localmem: 128  # GB
  chemistry: "SC3Pv4"

# Space Ranger (Visium HD) parameters
spaceranger:
  # pixi manifest that puts Space Ranger 4.1.0 (in $TOOLS) on PATH
  pixi_manifest: "envs/spaceranger/pixi.toml"
  transcriptome: "/dfs8/commondata/spaceranger/ref/refdata-gex-GRCh38-2020-A"
  probe_set: "/dfs8/commondata/spaceranger/probe/Human_V2/Visium_Human_Transcriptome_Probe_Set_v2.0_GRCh38-2020-A.csv"
  # searched recursively for <fastq_prefix>_S*_L*_R1_*.fastq.gz
  fastq_root: "data"
  # CytAssist run folders: each holds a *-run-info.csv plus one tif per capture area
  cytassist_dir: "metadata/H_E_images_out_0526I_16/CytAssist"
  # microscope images. The pattern is a glob relative to microscope_image_dir in
  # which {sample}, {slide}, {area} and {token} are substituted; {token} is the
  # first group captured from the sample name by microscope_image_regex. Here the
  # capture areas are <area>_TMA<n> and the images are one per TMA.
  microscope_image_dir: "metadata/H_E_images_out_0526I_16/TIFF"
  microscope_image_regex: "TMA\\s*(\\d+)$"
  microscope_image_pattern: "TMA {token}.tif"
  create_bam: false
  localcores: 24
  localmem: 112  # GB
  # extra bin size in microns, in addition to the standard 2/8/16 um (null = none)
  custom_bin_size:
  # Slurm resources for one capture area
  mem_mb: 120000
  runtime: 2880  # minutes
  partition: "standard"
  account: "sbsandme_lab"
  # Per-sample overrides, keyed by run id, by CytAssist sample name, or by
  # <slide>_<area> (the only stable key when a name repeats across slides).
  # Recognised: fastq_prefix, image, cytaimage, loupe_alignment, and slide+area
  # (which add --override-id, for when the CytAssist metadata is known wrong).
  samples: {}

# Downstream spatial analysis (squidpy / LIANA+)
#
# The heavy permutation steps run at 16 um only: 8 um is 2.5M bins across the six
# capture areas, against 650k at 16 um.
squidpy:
  # pixi env the squidpy rules run in (install: sbatch scripts/install_squidpy_pixi.sh);
  # every rule also exports PYTHONNOUSERSITE=1, because
  # ~/.local/lib/python3.12/site-packages otherwise shadows ~40 of its packages
  pixi_manifest: "envs/squidpy/pixi.toml"
  bin_sizes: ["008", "016"]
  heavy_bin_size: "016"   # nhood, co-occurrence, cell-cell communication, image features
  # spatial graphs, SVG, image features and plots are per capture area
  library_key: "run_id"
  # segmented cells (segmented_outputs/, Space Ranger >= 4.0 with an H&E image) run as a
  # third level, "cell", through every step including the heavy ones. Cells are not a
  # lattice, so the graph is k nearest neighbours rather than the square grid.
  cell:
    enabled: true
    coord_type: "generic"
    n_neighs: 6
  core_annotation_dir: "metadata/regions"
  # one Loupe core export per capture area inside core_annotation_dir; {sample} is
  # the run id and {tma} its TMA number from the tma column of sample_metadata
  core_annotation_pattern: "regions_tma{tma}.csv"
  sample_metadata: "metadata/sample_metadata.csv"
  conditions: ["normal", "pigmented"]
  qc:
    # A low absolute floor, then a relative per-section trim below. The floor exists to
    # remove bins that are uninformative in ANY section, which a purely relative filter
    # structurally cannot do: at min_counts 0 the object kept 32k bins under 10 counts,
    # and those formed 110 isolated components in the kNN graph, forcing 273 Leiden
    # clusters of which 213 held under 100 bins each.
    #
    # 10 is cheap because shallow bins hold almost no data: the floor removes 24% of
    # bins for 0.5% of the sequencing, and leaves no bin under 10 counts. It is not the
    # old min_counts of 50, which removed 87% of TMA2_top-right against 17% of
    # TMA4_top-left -- a 6.3x spread in retention over a 75x spread in raw depth
    # (4 to 300 counts), with condition nested inside section. At 10 the spread is 2.8x
    # and reflects genuinely uneven tissue quality rather than hiding it.
    min_counts: 10        # fallback for a level not listed below
    # One floor is not comparable across levels. An 8 um bin covers a quarter the area of
    # a 16 um bin, so 10 counts is ~4x stricter there: it keeps 69% of 16 um bins but
    # only 53% of 8 um bins, and costs 0.5% of the sequencing at 16 um against 1.9% at
    # 8 um. These values equalise that cost at ~0.5%, which is also what scaling by area
    # gives (10 / 4 = 2.5). Cells are segmented objects with a median of 530 counts, so
    # the floor barely binds there at all.
    min_counts_per_level:
      square_016um: 10    # 99.51% of counts kept
      # 3 matches the 0.5%-of-counts criterion and area scaling, but is NOT in use: at
      # floor 10 the 8 um graph already breaks into 61 components with n_neighbors 30,
      # so a lower floor would fragment it further. The floor's job here is connectivity,
      # not cost. Held at 10 pending the n_neighbors sweep for this level.
      square_008um: 10    # 98.15% of counts
      cell: 10            # 99.08%
    min_genes: 0          # one depth axis is enough; counts and genes are collinear
    min_cells: 10         # gene-level, applied once over the whole object after the trim
    max_pct_mt: 25        # different axis from depth; removes 0.55% of bins overall
    # QC figures, the quantile trim and the section report are all per section -- one TMA
    # core. Grouping by run_id instead averages each bad section away against the three
    # other cores of its capture area.
    group_key: "core_id"
    quantile_trim:
      enabled: true
      metric: "total_counts"
      lower: 0.1          # applied to what survives min_counts, per section
      # No upper trim. These are bins, not cells, so there is no doublet at the top: a
      # high-count 16 um bin is dense tissue (epidermis, a dermal cell cluster). The top
      # decile holds 63.7% of all UMIs in the experiment at a median of 1485 genes per
      # bin, against 0.6% of UMIs for the bottom 30%. Cutting it discarded most of the
      # signal.
      upper: 1.0
    section_gate:
      # Report only. A section whose core interior is below this is named in the log and
      # in qc/section_qc.csv; nothing is ever excluded automatically, because dropping
      # TMA2's two pigmented cores would remove patient M007 from the paired
      # normal-vs-pigmented comparison entirely.
      #
      # Interior median depth is a continuum across the 24 sections -- 8.5, 13, 29, 37,
      # 39, 49, 50, 76 ... 481 -- so this number is a reporting convenience, not a
      # boundary found in the data. 20 names the two sections that are separated on the
      # column that does break cleanly, interior_frac_low: 0.53 and 0.43 of their core
      # interior under 10 counts, against 0.26 for the next section down.
      interior_median_counts: 20
  cluster:
    n_top_genes: 2000
    n_pcs: 30
    # 30 rather than scanpy's default 15: at 15 the kNN graph broke into 13 connected
    # components, and Leiden returns at least one cluster per component, so ~40 clusters
    # holding under 100 bins each were forced by topology and survived every resolution
    # down to 0.25. At 30 the graph is a single component (50 is no better).
    n_neighbors: 30
    # Measured on that graph: 0.25 gives 33 clusters but collapses 38% of bins into one,
    # 1.0 gives 60, and 0.5 gives 45 (31 of them substantial, largest 19% of bins) with
    # the fewest bins -- 679, 0.5% -- left in clusters under 500 bins.
    resolution: 0.5
    # UMAP only: lower packs clusters tighter on the plot; graph and Leiden unchanged
    umap_min_dist: 0.1
    # Per-level overrides for the two settings whose meaning changes with bin size.
    # Both fall back to the values above for a level not listed. 8 um is pending the
    # n_neighbors sweep: at 30 its graph has 61 components against 1 at 16 um.
    # 8 um needs a much larger neighbourhood: measured on its Harmony embedding, the
    # graph has 61 components at 30, 33 at 50, 11 at 75 and 1 at 100. Unlike 16 um,
    # connecting it does not clear the small-cluster tail -- 78 clusters under 100 bins
    # survive at every setting -- so those are genuinely sparse regions, not topology.
    # At 100 the level gives 33 substantial clusters against 30 at 16 um.
    n_neighbors_per_level:
      square_008um: 100
    resolution_per_level: {}
    # Harmony runs once per key in batch_keys, writing one clustered object per
    # key, so the corrections are applied and compared separately rather than
    # jointly. sample_id is one batch per biological sample,
    # <patient_id>_<condition>_W<timepoint>: 22 levels against 24 cores, because
    # the two A1_TMA6 cores of each condition are technical replicates of one
    # sample and share a batch. patient_id is one batch per patient; because
    # each patient occupies exactly one capture area, that run corrects the
    # between-patient/between-section component of variation on top of what
    # sample_id corrects. Every sample_id batch is a single condition x
    # timepoint, so either run of Harmony also pulls the conditions together --
    # read qc*/cluster_by_condition.csv, and compare the two integrations
    # against each other and against use_harmony: false, before trusting
    # condition-specific clusters. Expression-level DE is unaffected: Harmony
    # only rewrites the embedding.
    # The primary key's outputs keep the canonical names every downstream rule
    # consumes (clustered.h5ad, markers.csv, qc/, figures/); every other key
    # gets a _<key> suffix (clustered_patient_id.h5ad, markers_patient_id.csv,
    # qc_patient_id/, figures_patient_id/).
    batch_keys: ["sample_id", "patient_id"]
    primary_batch_key: "sample_id"
    harmony_theta: 2.0    # lower corrects more gently
    # Select HVGs over the whole object rather than per batch: with near-empty sections
    # in the mix, per-batch selection lets them contribute noise genes to the 2000.
    hvg_batch_key: null
    # Drop bins with fewer raw counts than this across the selected HVGs, before scaling.
    # A bin with no HVG counts scales to one shared row, so all such bins sit on a single
    # PCA point; Harmony offsets it once per batch and UMAP draws each copy as an island
    # ringing the main body. Before this filter they made up 91-98% of those islands at
    # 16 and 8 um: 1,853 bins (1.5%) at 16 um, 10,456 (3.0%) at 8 um, and 2 cells.
    # Bins with one or two counts (mostly a single FLG read at 8 um) sit just inside;
    # raise per level if they still island.
    min_hvg_counts: 1
    min_hvg_counts_per_level: {}
    # Only the cell level is integrated and clustered. Bins are too shallow to integrate
    # (median 15 HVG counts per 16 um bin): Harmony left the bin embeddings ordered by
    # depth, with islands of empty bins around them. Each bin instead takes the label of
    # the segmented cells covering most of its area (outs/barcode_mappings.parquet), from
    # the cell run with the same batch key, so bin and cell clusters share one meaning.
    # The *_per_level cluster settings and subsample_008 therefore only reach the cell
    # level now.
    label_transfer:
      # bins whose labelled-cell area is below this share of the bin are "unassigned"
      # (acellular matrix, or cells dropped by cell-level QC)
      min_cell_fraction: 0.25
      # further cell annotations to carry over alongside cluster_key, when present
      transfer_keys: ["broad_cell_type", "coarse_cell_type"]
    cluster_key: "leiden"
    use_harmony: true
    subsample_008: 800000  # cap for the 8 um object; null to cluster every bin
  # Tissue domains for bins, alongside the transferred cell labels: BANKSY-style, each
  # bin's scaled HVG expression joined to its spatial neighbours' mean, then PCA,
  # Harmony on the same batch key as the cell run, and Leiden. Unlike the transferred
  # labels this covers bins no cell reaches (62% of 16 um bins). Written as obs
  # "domain" in the bin-level clustered objects and drawn in the spatial panels.
  domains:
    enabled: true
    levels: ["square_016um"]
    n_rings: 2          # Moore rings at 16 um: 24 neighbours, ~80 um across
    lambda: 0.8         # neighbourhood weight; BANKSY's domain-finding default
    n_pcs: 30
    n_neighbors: 30
    resolution: 0.3     # domains are coarse; raise for finer regions
  spatial:
    coord_type: "grid"
    n_neighs: 8           # Moore neighbourhood on the HD square lattice, not hex 6
    n_rings: 1
    n_perms: 1000
    group_keys: ["condition", "timepoint_weeks"]
  cooccurrence:
    interval: 50          # number of radius steps
    max_radius_um: 500    # 0 = squidpy's data-range default, which never samples
                          # below a few hundred microns on a 6.5 mm capture area
    n_splits: 20
    max_bins_per_group: 50000
  svg:
    mode: "moran"
    n_perms: 100
    n_top_genes: 20
  ccc:                    # LIANA+ with CellChat scoring against CellChatDB
    resource: "cellchatdb"
    groupby: "leiden"
    group_key: "condition"
    n_perms: 1000
    expr_prop: 0.1
    top_n: 25
    spatial_local: true   # per-bin local LR scores via li.mt.bivariate
    local_name: "cosine"
    local_n_perms: 100
  image_features:
    features: ["summary", "texture"]
    scale: 0.5
    spot_scale: 2.0
  # Pseudobulk differential expression (pyDESeq2), one job per level x comparison.
  # Raw counts are summed per core (the TMA6 technical replicates share a core_index and
  # are summed together), over the whole core and per cluster. Comparisons follow
  # "metadata/9-30-26 Meta data for 10X visium seq data analysis.xlsx" (numbered below);
  # log2FC is test / reference. subset filters on sample_metadata columns first, then
  # only cores at test or reference of factor enter. paired: ~ patient_id + factor.
  de:
    levels: ["square_016um", "cell"]
    sample_key: "core_index"
    cluster_key: "leiden"
    min_obs_per_pseudobulk: 50         # drop sparse core x cluster pseudobulks
    min_samples_per_group: 2
    min_gene_counts: 10
    alpha: 0.05
    comparisons:
      # 1: normal vs melasma, baseline
      melasma_vs_normal_W0:
        {factor: sample_type, test: melasma, reference: normal, paired: true,
         subset: {diagnosis: melasma, timepoint_weeks: 0}}
      # 2: normal vs melasma, 16 weeks
      melasma_vs_normal_W16:
        {factor: sample_type, test: melasma, reference: normal, paired: true,
         subset: {diagnosis: melasma, timepoint_weeks: 16}}
      # 3: melasma, baseline vs 16 weeks
      melasma_W16_vs_W0:
        {factor: timepoint_weeks, test: 16, reference: 0, paired: true,
         subset: {sample_type: melasma}}
      # 4: normal vs PIH, baseline
      PIH_vs_normal_W0:
        {factor: sample_type, test: PIH, reference: normal, paired: true,
         subset: {diagnosis: PIH, timepoint_weeks: 0}}
      # 5: normal vs PIH, 16 weeks (P012 has no week-16 cores)
      PIH_vs_normal_W16:
        {factor: sample_type, test: PIH, reference: normal, paired: true,
         subset: {diagnosis: PIH, timepoint_weeks: 16}}
      # 6: PIH, baseline vs 16 weeks (P012 dropped: baseline only)
      PIH_W16_vs_W0:
        {factor: timepoint_weeks, test: 16, reference: 0, paired: true,
         subset: {sample_type: PIH}}
      # 7, 8: melasma vs PIH lesions. Different patients, so unpaired, and diagnosis is
      # confounded with patient / capture area
      melasma_vs_PIH_W0:
        {factor: sample_type, test: melasma, reference: PIH, paired: false,
         subset: {timepoint_weeks: 0}}
      melasma_vs_PIH_W16:
        {factor: sample_type, test: melasma, reference: PIH, paired: false,
         subset: {timepoint_weeks: 16}}
  resources:
    partition: "standard"
    account: "sbsandme_lab"
    make_adata:     {mem_mb: 32000,  cpus: 2,  runtime: 60}
    combine:        {mem_mb: 128000, cpus: 4,  runtime: 180}
    cluster_016:    {mem_mb: 128000, cpus: 8,  runtime: 480}
    cluster_008:    {mem_mb: 128000, cpus: 16, runtime: 1440}  # 16 um peaked at 22 GB; 8 um has ~2.2x the bins
    cluster_cell:   {mem_mb: 64000,  cpus: 8,  runtime: 240}
    spatial_stats:  {mem_mb: 192000, cpus: 16, runtime: 720}
    svg:            {mem_mb: 64000,  cpus: 8,  runtime: 240}
    ccc:            {mem_mb: 128000, cpus: 16, runtime: 480}
    image_features: {mem_mb: 96000,  cpus: 8,  runtime: 240}
    spatial_plots:  {mem_mb: 32000,  cpus: 2,  runtime: 60}
    de:             {mem_mb: 32000,  cpus: 4,  runtime: 120}

# scVI integration parameters
min_genes: 200
min_cells: 5
mt_thresh: 5
n_top_genes: 2000
batch_key: "batch"

## Scenic
TFs: "/dfs9/ucightf-lab/kstachel/kstachel_references/scenic/hs_hgnc_curated_tfs.txt"
motifs: "/dfs9/ucightf-lab/kstachel/kstachel_references/scenic/motifs-v9-nr.hgnc.tbl"
feather_db: "/dfs9/ucightf-lab/kstachel/kstachel_references/scenic/hg38_refseq-10kb_up_and_down_tss.mc9nr.feather"

